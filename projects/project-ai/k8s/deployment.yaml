apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend
  namespace: sebi
  labels:
    app: ai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
    spec:
      containers:
        - name: ai-backend
          image: 598515435126.dkr.ecr.ap-south-1.amazonaws.com/sebi-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: ai-backend-config
            - secretRef:
                name: ai-backend-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-backend
  namespace: sebi
  labels:
    app: ai-backend
spec:
  selector:
    app: ai-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9000
  type: ClusterIP
