apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: sebi
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:598515435126:certificate/e3a27aa5-08a4-4738-bf4d-cfe39a36760e
    alb.ingress.kubernetes.io/group.name: onfinance-internal
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: complaint-management.onfinance.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
