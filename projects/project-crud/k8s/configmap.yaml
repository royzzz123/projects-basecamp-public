apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: sebi
  labels:
    app: backend
data:
  ENV: "prod"
  HTTP_PORT: "8080"
  LOG_LEVEL: "info"
  SHUTDOWN_TIMEOUT: "15s"
  MONGO_DB: "SEBI-project"
  JWT_ISSUER: "sebi-crud"
  JWT_TTL: "24h"
  CORS_ORIGINS: "https://complaint-management.onfinance.ai,http://localhost:3000,http://localhost:5173"
  COMPLAINTS_PAGE_DEFAULT: "50"
  COMPLAINTS_PAGE_MAX: "200"
  ENTITIES_PAGE_DEFAULT: "20"
  ENTITIES_PAGE_MAX: "100"
  ENTITY_LIST_PAGE_DEFAULT: "20"
  ENTITY_LIST_PAGE_MAX: "50"
