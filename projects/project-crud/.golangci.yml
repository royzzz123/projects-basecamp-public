version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nilerr
    - revive
    - staticcheck
    - unused
  settings:
    gosec:
      excludes:
        - G104 # duplicates errcheck
    revive:
      rules:
        # CLAUDE.md: default to no comments. Don't require godoc on every exported symbol.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        # Keep all other default revive rules (incl. redefines-builtin-id, unused-parameter).
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
